<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DreamGlobe — Interactive 3D Night Earth</title>
  <style>
    :root {
      --bg: #04060d;
      --panel: rgba(12, 20, 36, 0.82);
      --border: rgba(111, 211, 255, 0.22);
      --text: #e8f1ff;
      --muted: #8fa6c4;
      --accent: #6fd3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #globe {
      position: fixed;
      inset: 0;
      /* A faint radial wash behind the globe so the atmosphere has something
         to blend into instead of pure black. */
      background:
        radial-gradient(circle at 50% 45%, rgba(30, 64, 120, 0.35), transparent 60%),
        var(--bg);
    }

    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 260px;
      padding: 18px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10;
    }

    .panel h1 {
      margin: 0 0 4px;
      font-size: 17px;
      letter-spacing: 0.02em;
    }

    .panel p {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    .cities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cities button {
      flex: 1 1 auto;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text);
      background: rgba(111, 211, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cities button:hover { background: rgba(111, 211, 255, 0.18); }
    .cities button:active { background: rgba(111, 211, 255, 0.28); }

    .stats {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 8px 12px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 10;
    }

    .card {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      min-width: 200px;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 10;
    }

    .card.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .card strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .card span { font-size: 12px; color: var(--muted); }

    @media (max-width: 600px) {
      .panel { top: 12px; left: 12px; right: 12px; width: auto; padding: 14px; }
      .stats { right: 12px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div id="globe"></div>

  <div class="panel">
    <h1>DreamGlobe</h1>
    <p>Drag to spin, scroll or pinch to zoom, click a marker for details.</p>
    <div class="cities">
      <button data-lat="51.5074" data-lng="-0.1278">London</button>
      <button data-lat="35.6762" data-lng="139.6503">Tokyo</button>
      <button data-lat="-33.8688" data-lng="151.2093">Sydney</button>
      <button data-lat="40.7128" data-lng="-74.0060">New York</button>
    </div>
  </div>

  <div class="stats" id="stats">—</div>

  <div class="card" id="card">
    <strong id="card-title"></strong>
    <span id="card-detail"></span>
  </div>

  <script type="module">
    import { DreamGlobe } from './src/index.js'

    const globe = new DreamGlobe(document.querySelector('#globe'))

    // Exposed for console poking and for the screenshot tooling. Harmless in
    // a demo; a real embed would keep the instance in module scope.
    window.globe = globe

    // A spread of well-known cities, enough to show clustering and picking.
    const CITIES = [
      { lat: 51.5074, lng: -0.1278, title: 'London', pop: '9.6M' },
      { lat: 48.8566, lng: 2.3522, title: 'Paris', pop: '11.1M' },
      { lat: 40.7128, lng: -74.0060, title: 'New York', pop: '18.8M' },
      { lat: 34.0522, lng: -118.2437, title: 'Los Angeles', pop: '12.5M' },
      { lat: 35.6762, lng: 139.6503, title: 'Tokyo', pop: '37.4M' },
      { lat: 31.2304, lng: 121.4737, title: 'Shanghai', pop: '28.5M' },
      { lat: 39.9042, lng: 116.4074, title: 'Beijing', pop: '21.9M' },
      { lat: 28.6139, lng: 77.2090, title: 'Delhi', pop: '32.9M' },
      { lat: 55.7558, lng: 37.6173, title: 'Moscow', pop: '12.6M' },
      { lat: -33.8688, lng: 151.2093, title: 'Sydney', pop: '5.3M' },
      { lat: -23.5505, lng: -46.6333, title: 'São Paulo', pop: '22.6M' },
      { lat: -34.6037, lng: -58.3816, title: 'Buenos Aires', pop: '15.4M' },
      { lat: 30.0444, lng: 31.2357, title: 'Cairo', pop: '21.3M' },
      { lat: -1.2921, lng: 36.8219, title: 'Nairobi', pop: '5.1M' },
      { lat: 6.5244, lng: 3.3792, title: 'Lagos', pop: '15.4M' },
      { lat: 25.2048, lng: 55.2708, title: 'Dubai', pop: '3.5M' },
      { lat: 1.3521, lng: 103.8198, title: 'Singapore', pop: '5.9M' },
      { lat: 19.4326, lng: -99.1332, title: 'Mexico City', pop: '22.3M' },
      { lat: 43.6532, lng: -79.3832, title: 'Toronto', pop: '6.4M' },
      { lat: 52.5200, lng: 13.4050, title: 'Berlin', pop: '3.6M' },
      { lat: 37.5665, lng: 126.9780, title: 'Seoul', pop: '9.9M' },
      { lat: 13.7563, lng: 100.5018, title: 'Bangkok', pop: '10.7M' },
      { lat: 41.0082, lng: 28.9784, title: 'Istanbul', pop: '15.6M' },
      { lat: -26.2041, lng: 28.0473, title: 'Johannesburg', pop: '6.0M' },
    ]

    globe.addMarkers(CITIES.map((c) => ({ ...c, scale: 1 })))

    // A handful of routes radiating from three hubs, so the arc layer shows
    // both short hops and transoceanic spans.
    const byName = Object.fromEntries(CITIES.map((c) => [c.title, c]))
    const ROUTES = [
      ['London', 'New York'], ['London', 'Dubai'], ['London', 'Lagos'],
      ['London', 'Moscow'], ['London', 'Paris'],
      ['Tokyo', 'Los Angeles'], ['Tokyo', 'Singapore'], ['Tokyo', 'Sydney'],
      ['Tokyo', 'Seoul'], ['Tokyo', 'Shanghai'],
      ['Dubai', 'Delhi'], ['Dubai', 'Nairobi'], ['Dubai', 'Istanbul'],
      ['New York', 'São Paulo'], ['New York', 'Mexico City'], ['New York', 'Toronto'],
      ['Singapore', 'Bangkok'], ['São Paulo', 'Johannesburg'],
      ['Cairo', 'Istanbul'], ['Berlin', 'Moscow'],
    ]

    globe.addArcs(ROUTES.map(([a, b]) => ({
      from: [byName[a].lat, byName[a].lng],
      to: [byName[b].lat, byName[b].lng],
    })))

    const card = document.querySelector('#card')
    const cardTitle = document.querySelector('#card-title')
    const cardDetail = document.querySelector('#card-detail')
    let hideTimer = null

    globe.on('markerclick', (marker) => {
      cardTitle.textContent = marker.data.title
      cardDetail.textContent =
        `${marker.data.pop} · ${marker.lat.toFixed(2)}°, ${marker.lng.toFixed(2)}°`
      card.classList.add('visible')

      clearTimeout(hideTimer)
      hideTimer = setTimeout(() => card.classList.remove('visible'), 4000)

      globe.flyTo(marker.lat, marker.lng, { distance: 2.4 })
    })

    for (const button of document.querySelectorAll('.cities button')) {
      button.addEventListener('click', () => {
        globe.flyTo(Number(button.dataset.lat), Number(button.dataset.lng), { distance: 2.4 })
      })
    }

    // Frame counter, sampled once a second so the readout is stable. The draw
    // call count comes from the renderer itself rather than being asserted by
    // hand — it is the number worth proving.
    const stats = document.querySelector('#stats')
    let frames = 0
    let lastSample = performance.now()

    function sample() {
      frames++
      const now = performance.now()
      if (now - lastSample >= 1000) {
        const fps = Math.round((frames * 1000) / (now - lastSample))
        const calls = globe.renderer.info.render.calls
        stats.textContent =
          `${fps} fps · ${CITIES.length} markers · ${ROUTES.length} arcs · ${calls} draw calls`
        frames = 0
        lastSample = now
      }
      requestAnimationFrame(sample)
    }
    requestAnimationFrame(sample)
  </script>
</body>
</html>
